<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stonks, then rekt: a chart climbs to a peak and falls off a cliff. Colors copied from the dark
       theme in theme.css (static files can't read the tokens; XML comments can't hold a double
       hyphen, so the token names lose theirs): success oklch(0.74 0.13 155), danger
       oklch(0.72 0.13 25), bg-raised oklch(0.2 0.025 264). -->
  <rect width="64" height="64" rx="15" fill="oklch(0.2 0.025 264)" />
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
    <!-- The fall first, so the peak stays green. -->
    <path d="M44.6 17.5 49.3 41.3" stroke="oklch(0.72 0.13 25)" />
    <path d="M10 46 22 32l7 6 15-23" stroke="oklch(0.74 0.13 155)" />
  </g>
  <path d="M41.5 43.1 57.1 39.5 52 53Z" fill="oklch(0.72 0.13 25)" stroke="oklch(0.72 0.13 25)" stroke-width="2.5" stroke-linejoin="round" />
</svg>
